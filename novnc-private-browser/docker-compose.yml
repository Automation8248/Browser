version: "3.8"

services:
  chromium:
    image: lscr.io/linuxserver/chromium:latest
    container_name: novnc-private-browser
    security_opt:
      - seccomp:unconfined
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - CUSTOM_USER=${BROWSER_USER:-user@example.com}
      - PASSWORD=${BROWSER_PASSWORD:-changeme}
      # Chromium ko debugging port ke saath start karein (container ke andar 9222)
      - CHROME_CLI=--remote-debugging-port=9222 --no-first-run --no-default-browser-check
    volumes:
      # Persistent data: browser history, cookies, bookmarks sab yahan save honge
      - ./browser-data:/config
    ports:
      - "${NOVNC_PORT:-3000}:3000"   # noVNC web interface
      - "${CDP_PORT:-9223}:9223"      # Bridged CDP (Python control ke liye)
    shm_size: "2gb"
    restart: unless-stopped
