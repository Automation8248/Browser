name: Keep Render Awake

on:
  schedule:
    # Yeh cron job har 1 minute mein chalne ke liye set hai
    - cron: '* * * * *'
  workflow_dispatch: # Github actions tab se manually chalane ke liye

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Server
        run: |
          curl -s https://browser-wcke.onrender.com/ > /dev/null
          echo "Ping successful! Render server is awake."
