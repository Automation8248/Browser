<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lovora Cloud Browser | Advanced</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        .tab-active { background-color: #1f2937; border-top: 2px solid #3b82f6; }
        .tab-inactive { background-color: #111827; opacity: 0.7; }
        .tab-inactive:hover { opacity: 1; }
    </style>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col overflow-hidden" onload="checkAutoLogin()">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="flex-1 flex items-center justify-center bg-gray-900 z-50">
        <div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-96 border border-gray-700 relative">
            <div class="flex items-center justify-center mb-6">
                <i class="fa-solid fa-earth-americas text-4xl text-blue-500 mr-3"></i>
                <h2 class="text-2xl font-bold">Lovora Browser</h2>
            </div>
            
            <div class="space-y-4" id="login-form">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Standard Login</label>
                    <input type="text" id="username" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 mb-2 focus:border-blue-500 transition" placeholder="User ID">
                    <input type="password" id="password" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 focus:border-blue-500 transition" placeholder="Password">
                </div>
                
                <div class="flex items-center text-gray-500 text-xs">
                    <div class="flex-1 border-t border-gray-700"></div>
                    <span class="px-2">OR BYPASS WITH API</span>
                    <div class="flex-1 border-t border-gray-700"></div>
                </div>

                <div>
                    <input type="text" id="api-key-input" class="w-full bg-gray-900 border border-gray-700 text-green-400 rounded-lg px-4 py-2 focus:border-green-500 transition" placeholder="Paste API Key here...">
                </div>

                <button onclick="login()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-200 mt-2">
                    Connect to Cloud
                </button>
                <p id="msg" class="text-yellow-400 text-sm text-center mt-2"></p>
            </div>
        </div>
    </div>

    <!-- BROWSER UI -->
    <div id="browser-ui" class="hidden flex-col h-full relative">
        
        <!-- Tab Bar -->
        <div class="bg-gray-950 flex items-center px-2 pt-2 gap-1 border-b border-gray-800 overflow-x-auto" id="tab-container">
            <!-- Tabs dynamically inject honge -->
            <button onclick="createNewTab()" class="hover:bg-gray-800 p-2 rounded-full text-gray-400 ml-1 transition" title="New Tab">
                <i class="fa-solid fa-plus text-sm"></i>
            </button>
            <div class="ml-auto flex gap-3 pr-2">
                <button onclick="toggleSettings()" class="text-gray-400 hover:text-white transition p-2" title="Settings & API"><i class="fa-solid fa-gear"></i></button>
            </div>
        </div>

        <!-- Address Bar Area -->
        <div class="bg-gray-800 p-2 flex items-center gap-2 border-b border-gray-700 shadow-md">
            <!-- Navigation Buttons -->
            <div class="flex items-center gap-1 text-gray-400">
                <button onclick="browserAction('back')" class="p-2 hover:bg-gray-700 rounded-full transition" title="Back (Undo)"><i class="fa-solid fa-arrow-left"></i></button>
                <button onclick="browserAction('forward')" class="p-2 hover:bg-gray-700 rounded-full transition" title="Forward (Redo)"><i class="fa-solid fa-arrow-right"></i></button>
                <button onclick="browserAction('reload')" class="p-2 hover:bg-gray-700 rounded-full transition" title="Refresh"><i class="fa-solid fa-rotate-right"></i></button>
                <button onclick="goHome()" class="p-2 hover:bg-gray-700 rounded-full transition" title="Home"><i class="fa-solid fa-house"></i></button>
            </div>
            
            <!-- URL Input -->
            <div class="flex-1 flex items-center bg-gray-900 rounded-full px-4 py-1.5 border border-gray-700 focus-within:border-blue-500 transition">
                <i class="fa-solid fa-lock text-green-500 text-xs mr-2"></i>
                <input type="text" id="url" class="bg-transparent border-none outline-none w-full text-sm text-gray-200" placeholder="Search or type a URL (e.g., https://example.com)">
                <button onclick="navigate()" class="text-blue-400 hover:text-blue-300 p-1"><i class="fa-solid fa-arrow-right-to-bracket"></i></button>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="hidden bg-blue-600 text-xs text-center py-1 font-semibold tracking-wider animate-pulse z-10">
            Processing securely in cloud...
        </div>

        <!-- Webpage Render Area -->
        <div class="flex-1 bg-white overflow-auto flex items-start justify-center relative">
            <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-900 text-gray-500">
                <i class="fa-brands fa-chrome text-6xl mb-4 opacity-20"></i>
                <p>Cloud Browser Ready</p>
            </div>
            <img id="browser-screen" src="" class="max-w-full hidden shadow-2xl transition-opacity duration-200">
        </div>

        <!-- Settings Modal (Advanced) -->
        <div id="settings-modal" class="hidden absolute top-24 right-4 bg-gray-800 border border-gray-700 rounded-lg p-4 shadow-2xl w-80 z-50">
            <h3 class="text-lg font-bold mb-3 border-b border-gray-700 pb-2">Settings & API</h3>
            
            <!-- Session Info -->
            <div class="mb-4 bg-gray-900 p-2 rounded border border-gray-700">
                <p class="text-xs text-gray-400 mb-1">Active Session ID:</p>
                <div class="flex justify-between items-center text-sm font-mono text-blue-400">
                    <span id="display-session-id" class="truncate w-56"></span>
                    <button onclick="copyText(sessionId, 'sess-copy-icon')" class="text-gray-400 hover:text-white" title="Copy Session ID">
                        <i id="sess-copy-icon" class="fa-regular fa-copy"></i>
                    </button>
                </div>
            </div>

            <p class="text-xs text-gray-400 mb-1">Your API Keys:</p>
            <ul id="api-key-list" class="space-y-2 mb-3 text-sm text-gray-300 max-h-32 overflow-y-auto"></ul>
            
            <button onclick="generateApiKey()" class="w-full bg-green-600 hover:bg-green-700 py-1.5 rounded text-sm mb-2 transition">Generate New API Key</button>
            <div class="flex gap-2">
                <button onclick="logout()" class="flex-1 bg-red-600 hover:bg-red-700 py-1.5 rounded text-sm transition">Logout</button>
                <button onclick="toggleSettings()" class="flex-1 bg-gray-700 hover:bg-gray-600 py-1.5 rounded text-sm transition">Close</button>
            </div>
        </div>
    </div>

<script>
    // Apka Render API link
    const API_BASE = "https://browser-wcke.onrender.com/api"; 
    
    let apiKey = "";
    let sessionId = "";
    let tabs = {}; // Memory Cache for Tabs
    let activeTabId = "";

    // Auto-Login if API Key is saved in local storage
    function checkAutoLogin() {
        const savedKey = localStorage.getItem('lovora_api_key');
        if (savedKey) {
            apiKey = savedKey;
            document.getElementById('api-key-input').value = savedKey;
            login(true);
        }
    }

    async function login(isAuto = false) {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        const manualApiKey = document.getElementById('api-key-input').value;
        
        document.getElementById('msg').innerText = "Connecting to Cloud Server...";
        
        try {
            // API Bypass Logic
            if (manualApiKey) {
                apiKey = manualApiKey;
                localStorage.setItem('lovora_api_key', apiKey); // Save for future
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('browser-ui').style.display = 'flex';
                await startSession();
                return;
            }

            // Standard Username/Password Logic
            const res = await fetch(`${API_BASE}/login`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            });
            if (res.ok) {
                const data = await res.json();
                apiKey = data.api_key;
                localStorage.setItem('lovora_api_key', apiKey); // Save for future
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('browser-ui').style.display = 'flex';
                await startSession();
            } else {
                document.getElementById('msg').innerText = "Invalid User ID or Password!";
                if(isAuto) logout(); // clear invalid saved key
            }
        } catch(e) { 
            document.getElementById('msg').innerText = "Server is waking up (Wait 1-2 mins) or Error."; 
        }
    }

    function logout() {
        localStorage.removeItem('lovora_api_key');
        location.reload();
    }

    async function startSession() {
        showLoading("Starting secure session...");
        try {
            const res = await fetch(`${API_BASE}/browser/start`, { method: 'POST', headers: { 'x-api-key': apiKey }});
            if(!res.ok) throw new Error("Key might be invalid");
            const data = await res.json();
            
            sessionId = data.session_id;
            document.getElementById('display-session-id').innerText = sessionId;
            
            addTabToUI(data.tab_id, data.url, data.screenshot);
            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('browser-screen').style.display = 'block';
            hideLoading();
        } catch(e) {
            hideLoading();
            alert("Failed to start session. Server might be sleeping. Try again.");
            if(document.getElementById('login-screen').style.display === 'none') {
                logout(); // Reset if connection totally fails
            }
        }
    }

    async function createNewTab() {
        showLoading("Opening new tab...");
        try {
            const res = await fetch(`${API_BASE}/browser/${sessionId}/tabs/new`, { method: 'POST', headers: { 'x-api-key': apiKey }});
            const data = await res.json();
            addTabToUI(data.tab_id, data.url, data.screenshot);
            hideLoading();
        } catch(e) { hideLoading(); }
    }

    function addTabToUI(tabId, url, screenshot) {
        tabs[tabId] = { url: url, screenshot: screenshot };
        switchTab(tabId);
    }

    // INSTANT TAB MEMORY LOGIC
    function switchTab(tabId) {
        activeTabId = tabId;
        renderTabs();
        
        // Instantly load from JS Memory (No Reload, No Network Delay)
        if(tabs[activeTabId]) {
            document.getElementById('url').value = tabs[activeTabId].url;
            if(tabs[activeTabId].screenshot) {
                document.getElementById('browser-screen').src = tabs[activeTabId].screenshot;
            }
        }
        
        // Fetch background state silently just to be sure
        fetch(`${API_BASE}/browser/${sessionId}/tabs/${activeTabId}/get`, {
            method: 'POST', headers: { 'x-api-key': apiKey }
        }).then(res => res.json()).then(data => {
            if(data.screenshot) {
                tabs[activeTabId].screenshot = data.screenshot;
                if(activeTabId === tabId) document.getElementById('browser-screen').src = data.screenshot;
            }
        }).catch(e => console.log("Background sync failed"));
    }

    function renderTabs() {
        const container = document.getElementById('tab-container');
        Array.from(container.children).forEach(c => { 
            if(c.tagName !== 'BUTTON' || !c.innerHTML.includes('fa-plus')) c.remove(); 
        });
        
        let index = 1;
        Object.keys(tabs).forEach((tid) => {
            const isActive = tid === activeTabId;
            const tabEl = document.createElement('div');
            tabEl.className = `px-4 py-2 rounded-t-lg flex items-center gap-2 max-w-xs border-t border-l border-r border-gray-700 cursor-pointer transition ${isActive ? 'tab-active' : 'tab-inactive'}`;
            tabEl.onclick = () => switchTab(tid);
            tabEl.innerHTML = `<i class="fa-solid fa-globe ${isActive ? 'text-blue-400' : 'text-gray-400'} text-xs"></i><span class="text-sm truncate w-24">Tab ${index}</span>`;
            
            container.insertBefore(tabEl, container.lastElementChild.previousElementSibling);
            index++;
        });
    }

    async function navigate() {
        let url = document.getElementById('url').value;
        if(!url.startsWith('http')) { url = 'https://' + url; document.getElementById('url').value = url; }
        showLoading(`Loading ${url}...`);
        try {
            const res = await fetch(`${API_BASE}/browser/${sessionId}/tabs/${activeTabId}/goto`, {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey },
                body: JSON.stringify({ url: url })
            });
            updateTabData(await res.json());
        } catch(e) { hideLoading(); }
    }

    // Handles Back(Undo), Forward(Redo), Reload
    async function browserAction(action) {
        showLoading(`${action}ing...`);
        try {
            const res = await fetch(`${API_BASE}/browser/${sessionId}/tabs/${activeTabId}/${action}`, {
                method: 'POST', headers: { 'x-api-key': apiKey }
            });
            updateTabData(await res.json());
        } catch(e) { hideLoading(); }
    }

    function goHome() {
        document.getElementById('url').value = "https://google.com";
        navigate();
    }

    function updateTabData(data) {
        if(data && activeTabId && tabs[activeTabId]) {
            if(data.url) tabs[activeTabId].url = data.url;
            if(data.screenshot) tabs[activeTabId].screenshot = data.screenshot;
            
            // Instantly update UI
            document.getElementById('url').value = tabs[activeTabId].url;
            document.getElementById('browser-screen').src = tabs[activeTabId].screenshot;
        }
        hideLoading();
    }

    function showLoading(text) {
        document.getElementById('loading').style.display = 'block';
        document.getElementById('loading').innerText = text;
        document.getElementById('browser-screen').style.opacity = '0.5';
    }

    function hideLoading() {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('browser-screen').style.opacity = '1';
    }

    // --- COPY LOGIC ---
    function copyText(text, iconId) {
        navigator.clipboard.writeText(text).then(() => {
            const icon = document.getElementById(iconId);
            icon.className = "fa-solid fa-check text-green-400";
            setTimeout(() => { icon.className = "fa-regular fa-copy"; }, 2000);
        });
    }

    // --- API Settings Logic ---
    async function toggleSettings() {
        const modal = document.getElementById('settings-modal');
        if (modal.style.display === 'block') {
            modal.style.display = 'none';
        } else {
            modal.style.display = 'block';
            loadApiKeys();
        }
    }

    async function loadApiKeys() {
        try {
            const res = await fetch(`${API_BASE}/settings/keys`, { headers: { 'x-api-key': apiKey }});
            const data = await res.json();
            const list = document.getElementById('api-key-list');
            list.innerHTML = '';
            data.keys.forEach((k, index) => {
                const isCurrent = k === apiKey ? '<span class="text-[10px] text-green-400 border border-green-500 px-1 rounded ml-1">Active</span>' : '';
                const iconId = `api-copy-${index}`;
                list.innerHTML += `<li class="flex justify-between items-center bg-gray-900 p-2 rounded mb-1 border border-gray-700">
                    <span class="truncate w-36" title="${k}">${k} ${isCurrent}</span>
                    <div class="flex gap-3">
                        <i id="${iconId}" class="fa-regular fa-copy text-blue-400 cursor-pointer hover:text-blue-300" onclick="copyText('${k}', '${iconId}')" title="Copy API Key"></i>
                        <i class="fa-solid fa-trash text-red-500 cursor-pointer hover:text-red-400" onclick="deleteApiKey('${k}')" title="Delete Key"></i>
                    </div>
                </li>`;
            });
        } catch(e) { console.log("Could not load API keys"); }
    }

    async function generateApiKey() {
        await fetch(`${API_BASE}/settings/keys/generate`, { method: 'POST', headers: { 'x-api-key': apiKey }});
        loadApiKeys();
    }

    async function deleteApiKey(keyToDelete) {
        if(keyToDelete === apiKey) return alert("You cannot delete the API key you are currently using!");
        if(confirm("Are you sure you want to delete this API Key?")) {
            await fetch(`${API_BASE}/settings/keys/${keyToDelete}`, { method: 'DELETE', headers: { 'x-api-key': apiKey }});
            loadApiKeys();
        }
    }
    
    document.getElementById('url').addEventListener('keypress', e => { 
        if (e.key === 'Enter') navigate(); 
    });

    // BACKGROUND PING (To keep server awake)
    setInterval(() => {
        if (sessionId) { 
            const pingUrl = API_BASE.replace('/api', '/');
            fetch(pingUrl, { mode: 'no-cors' }).catch(() => {});
        }
    }, 60000); 

</script>
</body>
</html>
