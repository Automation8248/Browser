<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lovora Cloud Browser</title>
    <!-- Tailwind CSS for modern responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for professional browser icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Custom scrollbar for a clean look */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
    </style>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col overflow-hidden">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="flex-1 flex items-center justify-center bg-gray-900">
        <div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-96 border border-gray-700">
            <div class="flex items-center justify-center mb-6">
                <i class="fa-solid fa-earth-americas text-4xl text-blue-500 mr-3"></i>
                <h2 class="text-2xl font-bold">Lovora Browser</h2>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">User ID</label>
                    <input type="text" id="username" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500 transition" placeholder="Enter your ID">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Password</label>
                    <input type="password" id="password" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500 transition" placeholder="••••••••">
                </div>
                <button onclick="login()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-200 mt-2">
                    Connect to Cloud
                </button>
                <p id="msg" class="text-yellow-400 text-sm text-center mt-2"></p>
            </div>
        </div>
    </div>

    <!-- BROWSER UI (Hidden by default) -->
    <div id="browser-ui" class="hidden flex-col h-full">
        
        <!-- Tab Bar -->
        <div class="bg-gray-950 flex items-center px-2 pt-2 gap-1 border-b border-gray-800">
            <div class="bg-gray-800 px-4 py-2 rounded-t-lg flex items-center gap-2 max-w-xs border-t border-l border-r border-gray-700">
                <i class="fa-solid fa-globe text-gray-400 text-xs"></i>
                <span class="text-sm truncate">New Tab</span>
                <i class="fa-solid fa-xmark text-gray-400 hover:text-white cursor-pointer ml-2 text-xs"></i>
            </div>
            <button class="hover:bg-gray-800 p-2 rounded-full text-gray-400 transition ml-1">
                <i class="fa-solid fa-plus text-sm"></i>
            </button>
            <div class="ml-auto flex items-center gap-3 pr-2">
                <span class="text-xs text-gray-500">Session ID: <span id="sess-id" class="text-green-400 font-mono"></span></span>
            </div>
        </div>

        <!-- Address Bar Area -->
        <div class="bg-gray-800 p-2 flex items-center gap-2 border-b border-gray-700 shadow-md">
            <!-- Navigation Buttons -->
            <div class="flex items-center gap-1 text-gray-400">
                <button class="p-2 hover:bg-gray-700 rounded-full transition"><i class="fa-solid fa-arrow-left"></i></button>
                <button class="p-2 hover:bg-gray-700 rounded-full transition"><i class="fa-solid fa-arrow-right"></i></button>
                <button class="p-2 hover:bg-gray-700 rounded-full transition" onclick="navigate()"><i class="fa-solid fa-rotate-right"></i></button>
                <button class="p-2 hover:bg-gray-700 rounded-full transition"><i class="fa-solid fa-house"></i></button>
            </div>
            
            <!-- URL Input -->
            <div class="flex-1 flex items-center bg-gray-900 rounded-full px-4 py-1.5 border border-gray-700 focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500 transition">
                <i class="fa-solid fa-lock text-green-500 text-xs mr-2"></i>
                <input type="text" id="url" class="bg-transparent border-none outline-none w-full text-sm text-gray-200" placeholder="Search Google or type a URL (e.g., https://example.com)">
                <button onclick="navigate()" class="text-blue-400 hover:text-blue-300 ml-2"><i class="fa-solid fa-arrow-right-to-bracket"></i></button>
            </div>

            <!-- Settings / Close Session -->
            <button onclick="closeSession()" class="px-3 py-1.5 bg-red-500/10 hover:bg-red-500/20 text-red-500 border border-red-500/20 rounded-lg text-sm transition flex items-center gap-2">
                <i class="fa-solid fa-power-off"></i> End
            </button>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="hidden bg-blue-600 text-xs text-center py-1 animate-pulse">
            Rendering webpage from cloud securely...
        </div>

        <!-- Webpage Render Area -->
        <div id="render-area" class="flex-1 bg-white overflow-auto relative flex items-start justify-center">
            <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-900 text-gray-500">
                <i class="fa-brands fa-chrome text-6xl mb-4 opacity-20"></i>
                <p>Enter a URL to start browsing</p>
            </div>
            <img id="browser-screen" src="" alt="" class="max-w-full hidden shadow-2xl">
        </div>
    </div>

<script>
    // Apne Render API ka URL yahan update karna mat bhoolna
    const API_BASE = "https://browser-wcke.onrender.com/api"; 
    let apiKey = "";
    let sessionId = "";

    async function login() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        document.getElementById('msg').innerText = "Authenticating...";
        
        try {
            const res = await fetch(`${API_BASE}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            });
            if (res.ok) {
                const data = await res.json();
                apiKey = data.api_key;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('browser-ui').style.display = 'flex';
                startSession();
            } else {
                document.getElementById('msg').innerText = "Invalid User ID or Password!";
            }
        } catch(e) {
            document.getElementById('msg').innerText = "Error connecting to server.";
        }
    }

    async function startSession() {
        document.getElementById('loading').style.display = 'block';
        document.getElementById('loading').innerText = "Starting secure isolated session...";
        try {
            const res = await fetch(`${API_BASE}/browser/start`, {
                method: 'POST', headers: { 'x-api-key': apiKey }
            });
            const data = await res.json();
            sessionId = data.session_id;
            document.getElementById('sess-id').innerText = sessionId.substring(0,8) + "...";
            document.getElementById('loading').style.display = 'none';
        } catch(e) {
            document.getElementById('loading').innerText = "Failed to start session.";
        }
    }

    async function navigate() {
        let url = document.getElementById('url').value;
        if(!url.startsWith('http')) {
            url = 'https://' + url;
            document.getElementById('url').value = url;
        }

        document.getElementById('empty-state').style.display = 'none';
        document.getElementById('browser-screen').style.display = 'block';
        document.getElementById('browser-screen').style.opacity = '0.5';
        document.getElementById('loading').style.display = 'block';
        document.getElementById('loading').innerText = "Fetching " + url + "...";
        
        try {
            const res = await fetch(`${API_BASE}/browser/${sessionId}/goto`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey },
                body: JSON.stringify({ url: url })
            });
            
            const data = await res.json();
            document.getElementById('browser-screen').src = data.screenshot;
            document.getElementById('browser-screen').style.opacity = '1';
            document.getElementById('loading').style.display = 'none';
        } catch(e) {
            document.getElementById('loading').innerText = "Error loading page.";
            document.getElementById('loading').classList.replace('bg-blue-600', 'bg-red-600');
            setTimeout(() => document.getElementById('loading').style.display = 'none', 3000);
        }
    }

    async function closeSession() {
        if(confirm("Are you sure you want to end this secure session?")) {
            await fetch(`${API_BASE}/browser/close/${sessionId}`, { method: 'POST', headers: { 'x-api-key': apiKey }});
            location.reload();
        }
    }
    
    // Allow pressing Enter key to search
    document.getElementById('url').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') navigate();
    });
</script>
</body>
</html>
