<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lovora Cloud Browser Max Pro</title>
    <!-- Tailwind for Login UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #202124; color: white; margin: 0; padding: 0; overflow-x: hidden; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        /* --- BROWSER UI CSS (Hidden by default until login) --- */
        #app-screen { display: none; flex-direction: column; height: 100vh; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background-color: #202124; position: fixed; top: 0; width: 100%; z-index: 100; border-bottom: 1px solid #3c4043; }
        .nav-left, .nav-right { display: flex; align-items: center; gap: 15px; }
        .nav-icon { font-size: 20px; color: #e8eaed; cursor: pointer; padding: 10px; border-radius: 50%; transition: background 0.2s; }
        .nav-icon:hover { background-color: #3c4043; }
        .tab-box { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border: 2px solid #e8eaed; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .tab-box:hover { background-color: #3c4043; }

        .sidebar { position: fixed; top: 0; right: -300px; width: 280px; height: 100vh; background-color: #292a2d; box-shadow: -2px 0 10px rgba(0,0,0,0.5); transition: right 0.3s ease-in-out; z-index: 1000; }
        .sidebar.active { right: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid #5f6368; }
        .sidebar-header h3 { margin: 0; font-size: 18px; }
        .close-btn { font-size: 20px; cursor: pointer; color: #9aa0a6; }
        .close-btn:hover { color: white; }
        .sidebar-menu { list-style: none; padding: 0; margin: 0; }
        .sidebar-menu li { padding: 15px 20px; display: flex; align-items: center; gap: 15px; font-size: 15px; cursor: pointer; border-bottom: 1px solid #3c4043; transition: background 0.2s; }
        .sidebar-menu li:hover { background-color: #3c4043; }
        .sidebar-menu li.danger { color: #ef4444; }

        .main-content { display: flex; flex-direction: column; align-items: center; margin-top: 80px; width: 100%; padding: 0 20px; }
        .logo { font-size: 70px; font-weight: bold; margin-bottom: 15px; letter-spacing: -2px; }
        .logo span:nth-child(1) { color: #4285F4; } .logo span:nth-child(2) { color: #EA4335; } .logo span:nth-child(3) { color: #FBBC05; } .logo span:nth-child(4) { color: #4285F4; } .logo span:nth-child(5) { color: #34A853; } .logo span:nth-child(6) { color: #EA4335; }

        .active-tab-badge { background-color: #3c4043; color: #8ab4f8; padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; margin-bottom: 20px; border: 1px solid #5f6368; }
        .search-container { width: 100%; max-width: 584px; position: relative; }
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #9aa0a6; font-size: 18px; }
        .search-input { width: 100%; padding: 15px 45px; border-radius: 24px; border: 1px solid #5f6368; background-color: #303134; color: #e8eaed; font-size: 16px; outline: none; box-shadow: 0 1px 6px 0 rgba(0,0,0,0.3); transition: background-color 0.3s; }
        .search-input:focus { background-color: #303134; box-shadow: 0 1px 6px 0 rgba(0,0,0,0.5); border-color: rgba(223,225,229,0); }

        .icon-container { display: flex; gap: 20px; margin-top: 30px; flex-wrap: wrap; justify-content: center; }
        .icon-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #e8eaed; cursor: pointer; }
        .icon-circle { width: 50px; height: 50px; background-color: #303134; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 8px; transition: 0.2s; }
        .icon-item:hover .icon-circle { background-color: #3c4043; }
        .yt .icon-circle { color: #ff0000; } .fb .icon-circle { color: #1877f2; } .gh .icon-circle { color: #ffffff; } .ig .icon-circle { color: #e4405f; }
        .icon-item span { font-size: 12px; }

        .articles-section { width: 100%; max-width: 584px; margin-top: 40px; padding-bottom: 40px; }
        .articles-title { font-size: 18px; color: #9aa0a6; margin-bottom: 15px; border-bottom: 1px solid #3c4043; padding-bottom: 10px; }
        .article-card { display: block; background-color: #303134; padding: 15px; border-radius: 12px; margin-bottom: 15px; text-decoration: none; color: #e8eaed; transition: background 0.2s; cursor: pointer;}
        .article-card:hover { background-color: #3c4043; }
        .article-headline { font-size: 16px; font-weight: 500; margin-bottom: 8px; line-height: 1.4; }
        .article-source { font-size: 12px; color: #9aa0a6; }

        /* Render Engine Image View */
        #browserView { display: none; width: 100%; height: calc(100vh - 60px); margin-top: 60px; background-color: #ffffff; overflow-y: auto; text-align: center; }
        #browser-screen { max-width: 100%; height: auto; box-shadow: 0px 4px 15px rgba(0,0,0,0.5); display: none; margin: 0 auto; }
        
        .tab-switcher { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background-color: #202124; z-index: 200; display: none; flex-direction: column; padding: 20px; overflow-y: auto; }
        .tab-switcher-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #5f6368; }
        .tab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .tab-card { background-color: #303134; border-radius: 10px; height: 180px; position: relative; border: 2px solid transparent; cursor: pointer; display: flex; flex-direction: column; }
        .tab-card.active { border-color: #8ab4f8; }
        .tab-header { display: flex; justify-content: space-between; padding: 8px 10px; background-color: #3c4043; border-top-left-radius: 8px; border-top-right-radius: 8px; font-size: 12px; }
        .close-tab-btn { color: #9aa0a6; cursor: pointer; padding: 0 5px; }
        .close-tab-btn:hover { color: white; }
        .tab-body { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #5f6368; text-align: center; padding: 10px; word-break: break-all;}
    </style>
</head>
<body class="bg-gray-900 h-screen overflow-hidden">

    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen" class="h-full flex flex-col items-center justify-center bg-gray-900">
        <div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-96 border border-gray-700">
            <div class="flex items-center justify-center mb-6">
                <i class="fa-solid fa-earth-americas text-4xl text-blue-500 mr-3"></i>
                <h2 class="text-2xl font-bold text-white">Lovora Cloud</h2>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">User ID</label>
                    <input type="text" id="username" class="w-full bg-gray-900 border border-gray-700 text-white rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500 transition" placeholder="Enter ID (admin)">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Password</label>
                    <input type="password" id="password" class="w-full bg-gray-900 border border-gray-700 text-white rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500 transition" placeholder="Enter Password (password123)">
                </div>
                <button onclick="login()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-200 mt-2">
                    Connect Server
                </button>
                <p id="msg" class="text-yellow-400 text-sm text-center mt-2"></p>
            </div>
        </div>
    </div>

    <!-- GLOBAL LOADING OVERLAY FOR API CALLS -->
    <div id="global-loading" class="hidden fixed inset-0 bg-gray-900 bg-opacity-90 z-[999] flex flex-col items-center justify-center text-white">
        <i class="fa-solid fa-circle-notch fa-spin text-4xl text-blue-500 mb-4"></i>
        <h2 id="loading-text" class="text-lg font-semibold">Starting Engine...</h2>
    </div>

    <!-- 2. MAIN BROWSER UI -->
    <div id="app-screen">
        
        <!-- Top Navigation -->
        <div class="top-bar">
            <div class="nav-left">
                <i class="fa-solid fa-house nav-icon" title="Home" onclick="goHome()"></i>
                <i class="fa-solid fa-rotate-right nav-icon" title="Refresh" onclick="refreshPage()"></i>
            </div>
            <div class="nav-right">
                <div class="text-green-400 text-xs hidden md:block">Connected: <span id="sess-id" class="font-mono"></span></div>
                <div class="tab-box" id="tabCountBtn" title="View Tabs" onclick="openTabSwitcher()">1</div>
                <i class="fa-solid fa-plus nav-icon" title="New Tab" onclick="createNewTab()"></i>
                <i class="fa-solid fa-ellipsis-vertical nav-icon" title="Menu" onclick="toggleSidebar()"></i>
            </div>
        </div>

        <!-- Sliding Sidebar Menu -->
        <div class="sidebar" id="settingsSidebar">
            <div class="sidebar-header text-white">
                <h3>Settings</h3>
                <i class="fa-solid fa-xmark close-btn" onclick="toggleSidebar()"></i>
            </div>
            <ul class="sidebar-menu text-gray-300">
                <li onclick="createNewTab(); toggleSidebar();"><i class="fa-solid fa-plus"></i> New Tab</li>
                <li onclick="goHome(); toggleSidebar();"><i class="fa-solid fa-house"></i> Home</li>
                <li onclick="closeSession()" class="danger mt-4 border-t border-gray-700"><i class="fa-solid fa-power-off"></i> Disconnect Server</li>
            </ul>
        </div>

        <!-- Main View (Home Screen) -->
        <div class="main-content" id="mainContent">
            <div class="logo">
                <span>L</span><span>o</span><span>v</span><span>o</span><span>r</span><span>a</span>
            </div>

            <div class="active-tab-badge" id="activeTabBadge">Currently on: Tab 1</div>

            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="userInput" class="search-input" placeholder="Search web or type URL" autocomplete="off" oninput="saveTypingLive()" onkeypress="checkEnter(event)">
            </div>

            <div class="icon-container">
                <div class="icon-item yt" onclick="openUrl('https://www.youtube.com', 'YouTube')"><div class="icon-circle"><i class="fa-brands fa-youtube"></i></div><span>YouTube</span></div>
                <div class="icon-item fb" onclick="openUrl('https://www.facebook.com', 'Facebook')"><div class="icon-circle"><i class="fa-brands fa-facebook"></i></div><span>Facebook</span></div>
                <div class="icon-item gh" onclick="openUrl('https://github.com', 'GitHub')"><div class="icon-circle"><i class="fa-brands fa-github"></i></div><span>GitHub</span></div>
                <div class="icon-item ig" onclick="openUrl('https://www.instagram.com', 'Instagram')"><div class="icon-circle"><i class="fa-brands fa-instagram"></i></div><span>Instagram</span></div>
            </div>

            <div class="articles-section">
                <div class="articles-title">Discover - Top Trending</div>
                <div id="articlesList"><p style="color: #9aa0a6; text-align: center;">Fetching news...</p></div>
            </div>
        </div>

        <!-- Render Engine View (Backend Image) -->
        <div id="browserView">
            <div id="render-loading" class="hidden flex-col items-center justify-center h-full text-gray-500">
                <i class="fa-solid fa-cloud-arrow-down text-5xl mb-4 animate-bounce"></i>
                <p>Rendering from Cloud Server...</p>
            </div>
            <img id="browser-screen" src="" alt="Webpage Render">
        </div>

        <!-- Tab Switcher -->
        <div class="tab-switcher" id="tabSwitcher">
            <div class="tab-switcher-header text-white">
                <h2>Open Tabs</h2>
                <div>
                    <i class="fa-solid fa-plus nav-icon" style="margin-right: 15px;" onclick="createNewTab()"></i>
                    <i class="fa-solid fa-check nav-icon" onclick="closeTabSwitcher()"></i>
                </div>
            </div>
            <div class="tab-grid" id="tabGrid"></div>
        </div>

    </div>

    <!-- CORE LOGIC & API INTEGRATION -->
    <script>
        // BACKEND RENDER URL
        const API_BASE = "https://browser-wcke.onrender.com/api"; 
        
        // GLOBAL VARIABLES
        let apiKey = "";
        let sessionId = "";
        let tabs = [{ id: 1, query: "", url: "", screenshot: "" }]; 
        let activeTabId = 1;
        let tabIdCounter = 1;

        // ------------------ API LOGIN & SESSION LOGIC ------------------
        
        async function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            document.getElementById('msg').innerText = "Authenticating...";
            
            try {
                const res = await fetch(`${API_BASE}/login`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                if (res.ok) {
                    const data = await res.json();
                    apiKey = data.api_key;
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('app-screen').style.display = 'flex';
                    startSession();
                } else {
                    document.getElementById('msg').innerText = "Invalid ID or Password!";
                }
            } catch(e) {
                document.getElementById('msg').innerText = "Error connecting to server.";
            }
        }

        async function startSession() {
            showGlobalLoader("Starting Remote Browser Session...");
            try {
                const res = await fetch(`${API_BASE}/browser/start`, {
                    method: 'POST', headers: { 'x-api-key': apiKey }
                });
                const data = await res.json();
                sessionId = data.session_id;
                document.getElementById('sess-id').innerText = sessionId.substring(0,6) + "..";
                hideGlobalLoader();
                fetchTrendingArticles();
            } catch(e) {
                hideGlobalLoader();
                alert("Failed to start session. Server might be sleeping. Try again.");
            }
        }

        async function closeSession() {
            if(confirm("End Cloud Session and Logout?")) {
                showGlobalLoader("Closing Server Resources...");
                try {
                    await fetch(`${API_BASE}/browser/close/${sessionId}`, { method: 'POST', headers: { 'x-api-key': apiKey }});
                } catch(e) {}
                location.reload();
            }
        }

        // ------------------ BROWSER NAVIGATION LOGIC ------------------

        async function openUrl(url, title) {
            document.getElementById('userInput').value = title || url;
            let currentTab = tabs.find(t => t.id === activeTabId);
            if (currentTab) {
                currentTab.query = title || url;
                currentTab.url = url;
            }
            
            // UI Switch to Browser View
            document.getElementById("mainContent").style.display = "none";
            document.getElementById("browserView").style.display = "block";
            document.getElementById("browser-screen").style.display = "none";
            document.getElementById("render-loading").style.display = "flex";
            document.body.style.overflowY = "hidden";
            updateVisualBadge();

            // API Call to Render Server
            try {
                const res = await fetch(`${API_BASE}/browser/${sessionId}/goto`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey },
                    body: JSON.stringify({ url: url })
                });
                
                const data = await res.json();
                if(data.screenshot) {
                    if (currentTab) currentTab.screenshot = data.screenshot; // Save to tab memory
                    document.getElementById("browser-screen").src = data.screenshot;
                    document.getElementById("render-loading").style.display = "none";
                    document.getElementById("browser-screen").style.display = "block";
                }
            } catch(e) {
                document.getElementById("render-loading").innerHTML = "<p class='text-red-500'>Error loading page. Try refresh.</p>";
            }
        }

        function checkEnter(event) {
            if (event.key === "Enter") {
                let query = document.getElementById("userInput").value;
                if (!query) return;
                saveTypingLive();

                let url = "";
                if (query.includes(".") && !query.includes(" ")) {
                    url = query.startsWith("http") ? query : "https://" + query;
                } else {
                    url = "https://www.google.com/search?q=" + encodeURIComponent(query);
                }
                openUrl(url, query);
            }
        }

        function refreshPage() {
            let currentTab = tabs.find(t => t.id === activeTabId);
            if (currentTab && currentTab.url) {
                openUrl(currentTab.url, currentTab.query); // Re-fetch from server
            } else {
                fetchTrendingArticles();
            }
        }

        // ------------------ TAB & UI MANAGEMENT ------------------

        function saveTypingLive() {
            let val = document.getElementById('userInput').value;
            let currentTab = tabs.find(t => t.id === activeTabId);
            if (currentTab) currentTab.query = val;
        }

        function updateVisualBadge() {
            let tabIndex = tabs.findIndex(t => t.id === activeTabId) + 1;
            let currentTab = tabs.find(t => t.id === activeTabId);
            let displayLabel = currentTab.query ? `Tab ${tabIndex} (${currentTab.query.substring(0,10)}...)` : `Tab ${tabIndex}`;
            document.getElementById('activeTabBadge').innerText = "Currently on: " + displayLabel;
            document.getElementById('tabCountBtn').innerText = tabs.length;
        }

        function goHome() {
            document.getElementById('browserView').style.display = 'none';
            document.getElementById('mainContent').style.display = 'flex';
            document.getElementById('userInput').value = "";
            document.body.style.overflowY = "auto";
            
            let currentTab = tabs.find(t => t.id === activeTabId);
            if(currentTab) { currentTab.query = ""; currentTab.url = ""; currentTab.screenshot = ""; }
            updateVisualBadge();
        }

        function createNewTab() {
            tabIdCounter++;
            tabs.push({ id: tabIdCounter, query: "", url: "", screenshot: "" });
            switchToTab(tabIdCounter); 
            goHome(); 
        }

        function switchToTab(id) {
            activeTabId = id;
            let targetTab = tabs.find(t => t.id === id);
            
            if (targetTab) {
                document.getElementById('userInput').value = targetTab.query;
                if(targetTab.url && targetTab.screenshot) {
                    document.getElementById("browser-screen").src = targetTab.screenshot;
                    document.getElementById("browser-screen").style.display = "block";
                    document.getElementById("render-loading").style.display = "none";
                    document.getElementById("mainContent").style.display = "none";
                    document.getElementById("browserView").style.display = "block";
                } else {
                    document.getElementById("browserView").style.display = "none";
                    document.getElementById("mainContent").style.display = "flex";
                }
            }
            updateVisualBadge(); 
            closeTabSwitcher(); 
        }

        function closeTab(id, event) {
            event.stopPropagation(); 
            tabs = tabs.filter(t => t.id !== id);
            if (tabs.length === 0) createNewTab(); 
            else {
                if (activeTabId === id) activeTabId = tabs[tabs.length - 1].id; 
                updateVisualBadge();
                renderTabCards(); 
            }
        }

        function openTabSwitcher() {
            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('browserView').style.display = 'none';
            document.getElementById('tabSwitcher').style.display = 'flex';
            renderTabCards();
        }

        function closeTabSwitcher() {
            document.getElementById('tabSwitcher').style.display = 'none';
            let currentTab = tabs.find(t => t.id === activeTabId);
            if (currentTab && currentTab.url !== "") document.getElementById('browserView').style.display = 'block';
            else document.getElementById('mainContent').style.display = 'flex';
        }

        function renderTabCards() {
            const grid = document.getElementById('tabGrid');
            grid.innerHTML = "";
            tabs.forEach((tab, index) => {
                let isActive = tab.id === activeTabId ? "active" : "";
                let title = tab.query ? tab.query : `New Tab`;
                grid.innerHTML += `
                    <div class="tab-card ${isActive}" onclick="switchToTab(${tab.id})">
                        <div class="tab-header text-white">
                            <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80%;">${title}</span>
                            <i class="fa-solid fa-xmark close-tab-btn" title="Close" onclick="closeTab(${tab.id}, event)"></i>
                        </div>
                        <div class="tab-body text-white flex-col">
                            <i class="fa-brands fa-chrome text-4xl mb-2"></i>
                            <div class="text-xs opacity-70">${title.substring(0,15)}</div>
                        </div>
                    </div>`;
            });
        }

        function toggleSidebar() { document.getElementById('settingsSidebar').classList.toggle('active'); }
        function showGlobalLoader(text) { document.getElementById('global-loading').style.display = 'flex'; document.getElementById('loading-text').innerText = text; }
        function hideGlobalLoader() { document.getElementById('global-loading').style.display = 'none'; }

        async function fetchTrendingArticles() {
            try {
                let response = await fetch('https://api.rss2json.com/v1/api.json?rss_url=https://news.google.com/rss?hl=en-IN&gl=IN&ceid=IN:en');
                let data = await response.json();
                if (data.status === 'ok') {
                    let articlesHTML = "";
                    data.items.slice(0, 10).forEach(article => {
                        let pubDate = new Date(article.pubDate).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
                        articlesHTML += `<div onclick="openUrl('${article.link}', '${article.title.replace(/'/g, "")}')" class="article-card">
                                <div class="article-headline">${article.title}</div><div class="article-source">News • ${pubDate}</div></div>`;
                    });
                    document.getElementById('articlesList').innerHTML = articlesHTML;
                }
            } catch(e) {}
        }
    </script>
</body>
</html>
