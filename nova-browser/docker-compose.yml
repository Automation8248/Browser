version: '3.8'

services:
  nova-server:
    build: .
    container_name: nova-server
    ports:
      - "8080:8080"        # WebSocket/HTTP API
      - "6080:6080"        # noVNC streaming
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - CHROMIUM_URL=ws://nova-chromium:9222
      - PROFILES_PATH=/data/profiles
      - MAX_TABS=20
      - EPHEMERAL=${EPHEMERAL:-false}
    volumes:
      - ./storage/profiles:/data/profiles
      - ./storage/downloads:/data/downloads
    depends_on:
      - nova-chromium
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    restart: unless-stopped

  nova-chromium:
    image: lscr.io/linuxserver/chromium:latest
    container_name: nova-chromium
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - CUSTOM_USER=nova
      - PASSWORD=${CHROMIUM_PASSWORD}
      - CHROME_CLI=--no-first-run --disable-dev-shm-usage --remote-debugging-port=9222
    volumes:
      - ./storage/profiles:/config
      - ./storage/downloads:/downloads
    ports:
      - "3000:3000"        # Internal debug port
    shm_size: "1gb"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped

  nova-novnc:
    image: theasp/novnc:latest
    container_name: nova-novnc
    environment:
      - DISPLAY_WIDTH=1920
      - DISPLAY_HEIGHT=1080
      - RUN_XTERM=no
    ports:
      - "6080:8080"
    depends_on:
      - nova-chromium
    restart: unless-stopped
