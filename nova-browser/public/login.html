<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Nova Browser · Sign in</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',system-ui,sans-serif}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1200px 600px at 20% 10%,#1a73e8 0%,#0b1220 60%,#050810 100%);
    color:#e8eaed;padding:20px}
  .card{width:100%;max-width:400px;background:rgba(30,32,38,.85);backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:40px 32px;
    box-shadow:0 30px 60px rgba(0,0,0,.6)}
  .logo{display:flex;align-items:center;gap:12px;margin-bottom:24px}
  .logo-icon{width:44px;height:44px;border-radius:12px;
    background:linear-gradient(135deg,#1a73e8,#8ab4f8);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;color:#fff;font-size:22px}
  h1{font-size:22px;font-weight:600;margin-bottom:4px}
  p.sub{color:#9aa0a6;font-size:13px;margin-bottom:28px}
  label{display:block;font-size:13px;color:#bdc1c6;margin-bottom:6px;font-weight:500}
  input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #3c4043;
    background:#202124;color:#e8eaed;font-size:14px;outline:none;transition:.15s}
  input:focus{border-color:#1a73e8;box-shadow:0 0 0 3px rgba(26,115,232,.2)}
  .field{margin-bottom:18px}
  button{width:100%;padding:13px;border-radius:10px;border:none;
    background:#1a73e8;color:#fff;font-size:15px;font-weight:600;
    cursor:pointer;transition:.15s}
  button:hover{background:#1765cc}
  button:disabled{opacity:.6;cursor:not-allowed}
  .err{margin-top:16px;color:#ff6b6b;font-size:13px;text-align:center;min-height:18px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">N</div>
    <div>
      <h1>Nova Browser</h1>
      <p class="sub">Secure access to your session</p>
    </div>
  </div>
  <form id="loginForm">
    <div class="field">
      <label for="username">Username</label>
      <input id="username" autocomplete="username" required />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required />
    </div>
    <button id="submitBtn" type="submit">Sign in</button>
    <div class="err" id="err"></div>
  </form>
</div>
<script>
  const form = document.getElementById('loginForm');
  const err  = document.getElementById('err');
  const btn  = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed');
      window.location.href = '/';
    } catch (e) {
      err.textContent = e.message;
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  });
  fetch('/api/auth/me').then(r => r.ok && (window.location.href = '/')).catch(() => {});
</script>
</body>
</html>
